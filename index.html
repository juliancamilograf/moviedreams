<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <title>Movie Dreams AR</title>
    <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>
    <style>
      body { margin: 0; overflow: hidden; }
      #startBtn {
        position: absolute;
        z-index: 999;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        background: #000;
        color: #fff;
        padding: 15px 30px;
        font-size: 18px;
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <button id="startBtn">Iniciar AR</button>

    <a-scene
      mindar-image="imageTargetSrc: ./target.mind;"
      vr-mode-ui="enabled: false"
      device-orientation-permission-ui="enabled: false"
      embedded
    >
      <a-assets>
        <video id="vid01" src="./01.mp4" preload="auto" playsinline crossorigin="anonymous"></video>
        <video id="vid02" src="./02.mp4" preload="auto" playsinline crossorigin="anonymous"></video>
      </a-assets>

      <!-- Marcador 1 -->
      <a-entity mindar-image-target="targetIndex: 0">
        <a-video src="#vid01" width="1" height="0.56" position="0 0 0"></a-video>
      </a-entity>

      <!-- Marcador 2 -->
      <a-entity mindar-image-target="targetIndex: 1">
        <a-video src="#vid02" width="1" height="0.56" position="0 0 0"></a-video>
      </a-entity>
    </a-scene>

    <script>
      document.getElementById('startBtn').addEventListener('click', () => {
        const vids = document.querySelectorAll('video');
        vids.forEach(v => {
          v.play();
          v.pause();
        });
        document.getElementById('startBtn').style.display = 'none';
      });
    </script>
  </body>
</html>
