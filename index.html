<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <title>Dreams AR</title>

  <!-- Librerías MindAR y A-Frame -->
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.1.5/dist/mindar-image.prod.js"></script>
  <script src="https://aframe.io/releases/1.2.0/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.1.5/dist/aframe/mindar-image-aframe.prod.js"></script>

  <style>
    body {
      margin: 0;
      overflow: hidden;
    }
    video {
      display: none; /* Ocultar videos nativos */
    }
  </style>
</head>
<body>

  <!-- Escena A-Frame con MindAR -->
  <a-scene
    mindar-image="imageTargetSrc: https://raw.githubusercontent.com/juliancamilograf/moviedreams/main/target.mind; autoStart: true; uiLoading: yes; uiScanning: yes; uiError: yes;"
    vr-mode-ui="enabled: false"
    device-orientation-permission-ui="enabled: false"
  >

    <!-- Pre-carga los videos con sus IDs -->
    <a-assets>
      <video id="vid1" src="https://ia600909.us.archive.org/20/items/dreamsproyecto/01.mp4" preload="auto" loop crossorigin="anonymous"></video>
      <video id="vid2" src="https://ia600909.us.archive.org/20/items/dreamsproyecto/02.mp4" preload="auto" loop crossorigin="anonymous"></video>
      <video id="vid3" src="https://ia600909.us.archive.org/20/items/dreamsproyecto/03.mp4" preload="auto" loop crossorigin="anonymous"></video>
      <video id="vid4" src="https://ia600909.us.archive.org/20/items/dreamsproyecto/04.mp4" preload="auto" loop crossorigin="anonymous"></video>
      <video id="vid5" src="https://ia600909.us.archive.org/20/items/dreamsproyecto/05.mp4" preload="auto" loop crossorigin="anonymous"></video>
      <video id="vid6" src="https://ia600909.us.archive.org/20/items/dreamsproyecto/06.mp4" preload="auto" loop crossorigin="anonymous"></video>
      <video id="vid7" src="https://ia600909.us.archive.org/20/items/dreamsproyecto/07.mp4" preload="auto" loop crossorigin="anonymous"></video>
      <video id="vid8" src="https://ia600909.us.archive.org/20/items/dreamsproyecto/08.mp4" preload="auto" loop crossorigin="anonymous"></video>
      <video id="vid9" src="https://ia600909.us.archive.org/20/items/dreamsproyecto/09.mp4" preload="auto" loop crossorigin="anonymous"></video>
      <video id="vid10" src="https://ia600909.us.archive.org/20/items/dreamsproyecto/10.mp4" preload="auto" loop crossorigin="anonymous"></video>
    </a-assets>

    <!-- Marcadores con videos diferentes para cada uno -->
    <a-entity mindar-image-target="targetIndex: 0">
      <a-video src="#vid1" width="1" height="0.5625" position="0 0 0"></a-video>
    </a-entity>

    <a-entity mindar-image-target="targetIndex: 1">
      <a-video src="#vid2" width="1" height="0.5625" position="0 0 0"></a-video>
    </a-entity>

    <a-entity mindar-image-target="targetIndex: 2">
      <a-video src="#vid3" width="1" height="0.5625" position="0 0 0"></a-video>
    </a-entity>

    <a-entity mindar-image-target="targetIndex: 3">
      <a-video src="#vid4" width="1" height="0.5625" position="0 0 0"></a-video>
    </a-entity>

    <a-entity mindar-image-target="targetIndex: 4">
      <a-video src="#vid5" width="1" height="0.5625" position="0 0 0"></a-video>
    </a-entity>

    <a-entity mindar-image-target="targetIndex: 5">
      <a-video src="#vid6" width="1" height="0.5625" position="0 0 0"></a-video>
    </a-entity>

    <a-entity mindar-image-target="targetIndex: 6">
      <a-video src="#vid7" width="1" height="0.5625" position="0 0 0"></a-video>
    </a-entity>

    <a-entity mindar-image-target="targetIndex: 7">
      <a-video src="#vid8" width="1" height="0.5625" position="0 0 0"></a-video>
    </a-entity>

    <a-entity mindar-image-target="targetIndex: 8">
      <a-video src="#vid9" width="1" height="0.5625" position="0 0 0"></a-video>
    </a-entity>

    <a-entity mindar-image-target="targetIndex: 9">
      <a-video src="#vid10" width="1" height="0.5625" position="0 0 0"></a-video>
    </a-entity>

  </a-scene>

  <script>
    // Reproducir video al detectar marcador, pausar y reiniciar al perderlo
    document.querySelectorAll('a-video').forEach((aVideo) => {
      const videoEl = document.querySelector(aVideo.getAttribute('src'));
      const parent = aVideo.parentElement;

      parent.addEventListener('targetFound', () => {
        videoEl.play();
      });

      parent.addEventListener('targetLost', () => {
        videoEl.pause();
        videoEl.currentTime = 0;
      });
    });
  </script>

</body>
</html>
