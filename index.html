<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <title>dreams stills</title>
  <script src="https://cdn.jsdelivr.net/gh/aframevr/aframe@1.5.0/dist/aframe-master.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.min.js"></script>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      width: 100%;
      overflow: hidden;
      background: #000;
    }
    #startButton {
      display: none;
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      padding: 1em 2em;
      font-size: 1.2em;
      background: white;
      color: black;
      border: none;
      border-radius: 10px;
      z-index: 10;
      cursor: pointer;
    }
    a-scene {
      position: fixed;
      top: 0;
      left: 0;
      height: 100%;
      width: 100%;
      display: none;
    }
    .permission-message {
      display: none;
      position: absolute;
      top: 20px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(0,0,0,0.7);
      color: white;
      padding: 10px 20px;
      border-radius: 5px;
      z-index: 100;
      text-align: center;
      max-width: 80%;
    }
    .debug-camera {
      position: fixed;
      bottom: 20px;
      right: 20px;
      width: 200px;
      height: 200px;
      z-index: 1000;
      border: 2px solid red;
      display: none; /* Oculto por defecto */
    }
    .debug-camera video {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }
  </style>
</head>
<body>

  <!-- Botón que se muestra solo en iOS -->
  <button id="startButton">Iniciar experiencia AR</button>
  <div id="permissionMessage" class="permission-message">
    Por favor permite el acceso a la cámara para usar esta experiencia AR.<br>
    Actualiza la página después de conceder los permisos.
  </div>
  
  <!-- Vista de depuración de la cámara -->
  <div id="debugCamera" class="debug-camera"></div>

  <a-scene
    mindar-image="imageTargetSrc: target.mind; autoStart: false"
    vr-mode-ui="enabled: false"
    renderer="useLegacyLights: false; antialias: true"
    loading-screen="enabled: false"
    device-orientation-permission-ui="enabled: true"
  >
    <a-assets>
      <video id="video1" src="01.mp4" loop muted playsinline preload="auto"></video>
      <video id="video2" src="02.mp4" loop muted playsinline preload="auto"></video>
      <video id="video3" src="03.mp4" loop muted playsinline preload="auto"></video>
      <video id="video4" src="04.mp4" loop muted playsinline preload="auto"></video>
      <video id="video5" src="05.mp4" loop muted playsinline preload="auto"></video>
      <video id="video6" src="06.mp4" loop muted playsinline preload="auto"></video>
      <video id="video7" src="07.mp4" loop muted playsinline preload="auto"></video>
      <video id="video8" src="08.mp4" loop muted playsinline preload="auto"></video>
      <video id="video9" src="09.mp4" loop muted playsinline preload="auto"></video>
      <video id="video10" src="10.mp4" loop muted playsinline preload="auto"></video>
    </a-assets>

    <a-camera 
      position="0 0 0" 
      look-controls="enabled: false"
      wasd-controls="enabled: false"
      active="true">
    </a-camera>

    <a-entity mindar-image-target="targetIndex: 0"><a-video src="#video1" width="1.78" height="1" position="0 0 0"></a-video></a-entity>
    <a-entity mindar-image-target="targetIndex: 1"><a-video src="#video2" width="1.78" height="1" position="0 0 0"></a-video></a-entity>
    <a-entity mindar-image-target="targetIndex: 2"><a-video src="#video3" width="1.78" height="1" position="0 0 0"></a-video></a-entity>
    <a-entity mindar-image-target="targetIndex: 3"><a-video src="#video4" width="1.78" height="1" position="0 0 0"></a-video></a-entity>
    <a-entity mindar-image-target="targetIndex: 4"><a-video src="#video5" width="1.78" height="1" position="0 0 0"></a-video></a-entity>
    <a-entity mindar-image-target="targetIndex: 5"><a-video src="#video6" width="1.78" height="1" position="0 0 0"></a-video></a-entity>
    <a-entity mindar-image-target="targetIndex: 6"><a-video src="#video7" width="1.78" height="1" position="0 0 0"></a-video></a-entity>
    <a-entity mindar-image-target="targetIndex: 7"><a-video src="#video8" width="1.78" height="1" position="0 0 0"></a-video></a-entity>
    <a-entity mindar-image-target="targetIndex: 8"><a-video src="#video9" width="1.78" height="1" position="0 0 0"></a-video></a-entity>
    <a-entity mindar-image-target="targetIndex: 9"><a-video src="#video10" width="1.78" height="1" position="0 0 0"></a-video></a-entity>
  </a-scene>

  <script>
    // Configuración inicial
    const isIOS = /iPhone|iPad|iPod/i.test(navigator.userAgent);
    const scene = document.querySelector("a-scene");
    const startBtn = document.getElementById("startButton");
    const permissionMessage = document.getElementById("permissionMessage");
    const debugCamera = document.getElementById("debugCamera");
    const videos = document.querySelectorAll("video");
    const targets = document.querySelectorAll("[mindar-image-target]");
    
    // Mostrar información de depuración
    console.log("Dispositivo:", navigator.userAgent);
    console.log("Soporte WebGL:", AFRAME.utils.device.checkWebGLSupport());
    console.log("MindAR cargado:", !!AFRAME.systems.mindarImage);

    // 1. Función para crear vista de depuración de la cámara
    function createDebugCameraView() {
      navigator.mediaDevices.getUserMedia({ video: true })
        .then(stream => {
          const video = document.createElement('video');
          video.srcObject = stream;
          video.autoplay = true;
          debugCamera.appendChild(video);
          debugCamera.style.display = 'block';
        })
        .catch(err => {
          console.error("Error al crear vista de depuración:", err);
        });
    }

    // 2. Función para iniciar AR
    async function startAR() {
      try {
        // Precarga videos
        await Promise.all(Array.from(videos).map(video => {
          return new Promise((resolve) => {
            video.load();
            video.play().then(() => {
              video.pause();
              resolve();
            }).catch(resolve);
          });
        });

        // Inicia MindAR
        const arSystem = scene.systems["mindar-image-system"];
        await arSystem.start();
        
        console.log("MindAR iniciado correctamente");
        scene.style.display = "block";
        startBtn.style.display = "none";
        
        // Opcional: ocultar vista de depuración después de 5 segundos
        setTimeout(() => {
          debugCamera.style.display = 'none';
        }, 5000);
        
      } catch (err) {
        console.error("Error al iniciar AR:", err);
        alert("Error al iniciar la experiencia AR. Por favor recarga la página.");
      }
    }

    // 3. Verificación de permisos mejorada
    async function checkCameraPermission() {
      try {
        const stream = await navigator.mediaDevices.getUserMedia({ video: true });
        console.log("Cámara accesible");
        stream.getTracks().forEach(track => track.stop());
        permissionMessage.style.display = "none";
        return true;
      } catch (err) {
        console.error("Error cámara:", err);
        permissionMessage.style.display = "block";
        return false;
      }
    }

    // 4. Inicialización completa
    document.addEventListener('DOMContentLoaded', async () => {
      // Crear vista de depuración (opcional, para diagnóstico)
      createDebugCameraView();
      
      // Espera a que A-Frame esté listo
      scene.addEventListener('loaded', async () => {
        const hasPermission = await checkCameraPermission();
        
        if (isIOS) {
          startBtn.style.display = hasPermission ? "block" : "none";
          startBtn.addEventListener("click", startAR);
        } else if (hasPermission) {
          startAR();
        }
      });

      // Control de videos
      targets.forEach((target, index) => {
        target.addEventListener("targetFound", () => {
          videos[index].play().catch(e => console.warn("Error al reproducir video:", e));
        });
        target.addEventListener("targetLost", () => {
          videos[index].pause();
          videos[index].currentTime = 0;
        });
      });
    });

    // Manejo de errores global
    window.addEventListener('error', (event) => {
      console.error("Error global:", event.error);
      permissionMessage.textContent = "Ocurrió un error. Por favor recarga la página.";
      permissionMessage.style.display = "block";
    });
  </script>
</body>
</html>
