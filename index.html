<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, user-scalable=no, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0">
  <title>dreams stills</title>
  <!-- Versiones específicas compatibles -->
  <script src="https://cdn.jsdelivr.net/npm/aframe@1.3.0/dist/aframe-master.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.1.5/dist/mindar-image-aframe.prod.min.js"></script>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      width: 100%;
      overflow: hidden;
      background: #000;
    }
    #startButton {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      padding: 15px 30px;
      font-size: 18px;
      background: #fff;
      color: #000;
      border: none;
      border-radius: 25px;
      z-index: 100;
      cursor: pointer;
      box-shadow: 0 4px 8px rgba(0,0,0,0.3);
    }
    #permissionMessage {
      display: none;
      position: absolute;
      top: 20px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(0,0,0,0.8);
      color: white;
      padding: 15px;
      border-radius: 10px;
      z-index: 100;
      text-align: center;
      max-width: 80%;
      font-size: 16px;
    }
    a-scene {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      display: none;
    }
    .loading {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: #000;
      z-index: 1000;
      display: flex;
      justify-content: center;
      align-items: center;
      color: white;
      font-size: 20px;
    }
  </style>
</head>
<body>

  <div id="loading" class="loading">
    Cargando experiencia AR...
  </div>

  <button id="startButton" style="display:none;">INICIAR EXPERIENCIA</button>
  <div id="permissionMessage"></div>

  <a-scene
    mindar-image="imageTargetSrc: target.mind; autoStart: false; uiLoading: no; uiScanning: no; uiError: no;"
    vr-mode-ui="enabled: false"
    renderer="colorManagement: true; precision: high;"
    loading-screen="enabled: false"
    device-orientation-permission-ui="enabled: false"
  >
    <a-assets>
      <!-- Videos con precarga explícita -->
      <video id="video1" src="01.mp4" loop muted playsinline webkit-playsinline preload="auto"></video>
      <video id="video2" src="02.mp4" loop muted playsinline webkit-playsinline preload="auto"></video>
      <video id="video3" src="03.mp4" loop muted playsinline webkit-playsinline preload="auto"></video>
      <video id="video4" src="04.mp4" loop muted playsinline webkit-playsinline preload="auto"></video>
      <video id="video5" src="05.mp4" loop muted playsinline webkit-playsinline preload="auto"></video>
      <video id="video6" src="06.mp4" loop muted playsinline webkit-playsinline preload="auto"></video>
      <video id="video7" src="07.mp4" loop muted playsinline webkit-playsinline preload="auto"></video>
      <video id="video8" src="08.mp4" loop muted playsinline webkit-playsinline preload="auto"></video>
      <video id="video9" src="09.mp4" loop muted playsinline webkit-playsinline preload="auto"></video>
      <video id="video10" src="10.mp4" loop muted playsinline webkit-playsinline preload="auto"></video>
    </a-assets>

    <a-camera 
      position="0 0 0" 
      look-controls="enabled: false"
      wasd-controls="enabled: false"
      cursor="rayOrigin: mouse">
    </a-camera>

    <!-- Targets con configuración simplificada -->
    <a-entity mindar-image-target="targetIndex: 0"><a-video src="#video1" width="1.78" height="1"></a-video></a-entity>
    <a-entity mindar-image-target="targetIndex: 1"><a-video src="#video2" width="1.78" height="1"></a-video></a-entity>
    <a-entity mindar-image-target="targetIndex: 2"><a-video src="#video3" width="1.78" height="1"></a-video></a-entity>
    <a-entity mindar-image-target="targetIndex: 3"><a-video src="#video4" width="1.78" height="1"></a-video></a-entity>
    <a-entity mindar-image-target="targetIndex: 4"><a-video src="#video5" width="1.78" height="1"></a-video></a-entity>
    <a-entity mindar-image-target="targetIndex: 5"><a-video src="#video6" width="1.78" height="1"></a-video></a-entity>
    <a-entity mindar-image-target="targetIndex: 6"><a-video src="#video7" width="1.78" height="1"></a-video></a-entity>
    <a-entity mindar-image-target="targetIndex: 7"><a-video src="#video8" width="1.78" height="1"></a-video></a-entity>
    <a-entity mindar-image-target="targetIndex: 8"><a-video src="#video9" width="1.78" height="1"></a-video></a-entity>
    <a-entity mindar-image-target="targetIndex: 9"><a-video src="#video10" width="1.78" height="1"></a-video></a-entity>
  </a-scene>

  <script>
    // Configuración de versiones compatibles
    console.log("Versión A-Frame:", AFRAME.version);
    console.log("MindAR cargado:", !!AFRAME.systems.mindarImage);

    // Elementos del DOM
    const loadingEl = document.getElementById('loading');
    const startBtn = document.getElementById('startButton');
    const permissionMsg = document.getElementById('permissionMessage');
    const sceneEl = document.querySelector('a-scene');
    const videos = document.querySelectorAll('video');
    
    // Detección de navegador
    const isIOS = /iPhone|iPad|iPod/i.test(navigator.userAgent);
    const isSafari = /^((?!chrome|android).)*safari/i.test(navigator.userAgent);

    // 1. Verificar compatibilidad WebGL
    function checkWebGL() {
      if (!AFRAME.utils.device.checkWebGLSupport()) {
        showError("Tu navegador no soporta WebGL. Prueba con Chrome o Firefox.");
        return false;
      }
      return true;
    }

    // 2. Solicitar permisos de cámara
    async function requestCamera() {
      try {
        const stream = await navigator.mediaDevices.getUserMedia({ 
          video: { 
            facingMode: 'environment',
            width: { ideal: 1280 },
            height: { ideal: 720 }
          } 
        });
        stream.getTracks().forEach(track => track.stop());
        return true;
      } catch (error) {
        console.error("Error cámara:", error);
        showError("Por favor permite acceso a la cámara para usar AR.");
        return false;
      }
    }

    // 3. Precargar y desbloquear videos
    async function prepareVideos() {
      try {
        await Promise.all(Array.from(videos).map(video => {
          return new Promise((resolve) => {
            video.load();
            video.play().then(() => {
              video.pause();
              resolve();
            }).catch(resolve); // Ignorar errores de autoplay
          });
        });
        return true;
      } catch (error) {
        console.error("Error videos:", error);
        return false;
      }
    }

    // 4. Iniciar AR
    async function startAR() {
      try {
        const arSystem = sceneEl.systems['mindar-image-system'];
        await arSystem.start();
        sceneEl.style.display = 'block';
        console.log("AR iniciado correctamente");
      } catch (error) {
        console.error("Error AR:", error);
        showError("Error al iniciar AR. Recarga la página.");
      }
    }

    // 5. Mostrar errores
    function showError(message) {
      permissionMsg.textContent = message;
      permissionMsg.style.display = 'block';
      loadingEl.style.display = 'none';
    }

    // 6. Configurar interacción
    function setupInteraction() {
      if (isIOS || isSafari) {
        startBtn.style.display = 'block';
        startBtn.addEventListener('click', async () => {
          startBtn.style.display = 'none';
          await startAR();
        });
      } else {
        startAR();
      }
    }

    // 7. Inicialización completa
    async function init() {
      if (!checkWebGL()) return;
      
      const hasCamera = await requestCamera();
      if (!hasCamera) return;
      
      await prepareVideos();
      setupInteraction();
      
      // Configurar eventos de targets
      document.querySelectorAll('[mindar-image-target]').forEach((target, index) => {
        target.addEventListener('targetFound', () => {
          videos[index].play().catch(e => console.warn("Error video:", e));
        });
        target.addEventListener('targetLost', () => {
          videos[index].pause();
          videos[index].currentTime = 0;
        });
      });
      
      loadingEl.style.display = 'none';
    }

    // Iniciar cuando el DOM esté listo
    document.addEventListener('DOMContentLoaded', init);
  </script>
</body>
</html>
